<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chariot of Fire Quest: 2 Kings</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1dc;--card:#fffaf0;--ink:#2a1d3b;--mut:#6b5a7a;--gold:#e8a317;--fire:#e4572e;--ok:#2e9e5b;--bad:#c93a4a;--line:#e6d3a8;--btn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171034;--card:#241a4d;--ink:#fdf3da;--mut:#b9a9d8;--line:#3d2f78;--btn:#2f2362}}
:root[data-theme="dark"]{--bg:#171034;--card:#241a4d;--ink:#fdf3da;--mut:#b9a9d8;--line:#3d2f78;--btn:#2f2362}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:800 17px/1.4 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,.d{font-family:Fredoka,system-ui,sans-serif;font-weight:700}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px}
h1{font-size:30px;line-height:1.1;margin:14px 0 4px}
.sub{color:var(--mut);font-weight:600;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.chip{border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#2a1d3b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .e{font-size:28px}.mode b{display:block;font-family:Fredoka;font-size:18px}.mode small{color:var(--mut);font-weight:600}
.mode.wide{grid-column:1/3}
.bar{height:14px;background:var(--line);border-radius:9px;position:relative;margin:14px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--fire));border-radius:9px;transition:width .4s}
.bar span{position:absolute;top:-12px;font-size:26px;transition:left .4s;transform:translateX(-50%)}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;font-size:20px;margin-bottom:14px}
.tag{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--fire);margin:0 4px}
.opt{display:block;width:100%;text-align:left;background:var(--btn);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;font:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{background:var(--card);border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;margin:6px 0 12px;font-weight:600}
.go{background:var(--fire);color:#fff;border:0;border-radius:99px;padding:13px 24px;font:700 18px Fredoka,sans-serif;cursor:pointer;box-shadow:0 4px 0 #a63a1d}
.go.alt{background:var(--ok);box-shadow:0 4px 0 #1f7240}.go.no{background:var(--bad);box-shadow:0 4px 0 #8d2633}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ans{font-size:22px;color:var(--ok);font-family:Fredoka}
.big{font-size:64px;text-align:center;margin:10px 0 0}
.center{text-align:center}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.link{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0}
</style></head><body><div id="app"></div>

"o": ["He shouted at Elijah", "He ran away", "He fell on his knees and pleaded", "He threw a spear"], "a": 2, "r": "2 Kings 1:13", "c": 1}, {"q": "Who became king after Ahaziah died?", "o": ["Jehu", "Jehoram", "Ahab", "Jeroboam"], "a": 1, "r": "2 Kings 1:17", "c": 1}, {"q": "Why did Jehoram become king in Ahaziah's place?", "o": ["Ahaziah had no son", "Jehoram won a battle", "The people chose him", "Elijah anointed him"], "a": 0, "r": "2 Kings 1:17", "c": 1}, {"q": "How did the LORD take Elijah up into heaven?", "o": ["By a cloud", "By an earthquake", "By a whirlwind", "By a ladder"], "a": 2, "r": "2 Kings 2:1", "c": 2}, {"q": "From which place did Elijah and Elisha start their journey?", "o": ["Gilgal", "Samaria", "Shunem", "Carmel"], "a": 0, "r": "2 Kings 2:1", "c": 2}, {"q": "Where did Elijah first say the LORD had sent him?", "o": ["Jericho", "Bethel", "The Jordan", "Samaria"], "a": 1, "r": "2 Kings 2:2", "c": 2}, {"q": "After Bethel, where did Elijah and Elisha go?", "o": ["Gilgal", "Samaria", "Jericho", "Shunem"], "a": 2, "r": "2 Kings 2:4", "c": 2}, {"q": "What did Elijah use to strike the water of the Jordan?", "o": ["His staff", "His mantle", "A stone", "His sandal"], "a": 1, "r": "2 Kings 2:8", "c": 2}, {"q": "How many sons of the prophets stood watching at a distance?", "o": ["Twelve", "Forty", "Fifty", "One hundred"], "a": 2, "r": "2 Kings 2:7", "c": 2}, {"q": "What did Elisha ask Elijah for?", "o": ["Riches", "A double portion of his spirit", "A long life", "A chariot"], "a": 1, "r": "2 Kings 2:9", "c": 2}, {"q": "Elijah said Elisha had asked a ____ thing.", "o": ["Hard", "Foolish", "Small", "Wrong"], "a": 0, "r": "2 Kings 2:10", "c": 2}, {"q": "What separated Elijah and Elisha?", "o": ["A river", "A chariot of fire with horses of fire", "A big wind", "An angel with a sword"], "a": 1, "r": "2 Kings 2:11", "c": 2}, {"q": "What did Elisha do with his own clothes when Elijah went up?", "o": ["Washed them", "Gave them away", "Tore them into two pieces", "Burned them"], "a": 2, "r": "2 Kings 2:12", "c": 2}, {"q": "For how many days did the fifty men search for Elijah?", "o": ["One", "Two", "Three", "Seven"], "a": 2, "r": "2 Kings 2:17", "c": 2}, {"q": "What did Elisha ask the men of Jericho to put in the new bowl?", "o": ["Oil", "Flour", "Water", "Salt"], "a": 3, "r": "2 Kings 2:20", "c": 2}, {"q": "What was wrong with the city of Jericho?", "o": ["The water was bad and the ground barren", "Enemies surrounded it", "There were lions", "A fire had burned it"], "a": 0, "r": "2 Kings 2:19", "c": 2}, {"q": "What did the youths call Elisha?", "o": ["Old man", "Baldhead", "Hairy man", "Stranger"], "a": 1, "r": "2 Kings 2:23", "c": 2}, {"q": "How many female bears came out of the woods?", "o": ["One", "Two", "Three", "Four"], "a": 1, "r": "2 Kings 2:24", "c": 2}, {"q": "How many youths did the bears maul?", "o": ["Twelve", "Twenty", "Forty-two", "Fifty"], "a": 2, "r": "2 Kings 2:24", "c": 2}, {"q": "How many years did Jehoram son of Ahab reign?", "o": ["Seven", "Ten", "Twelve", "Forty"], "a": 2, "r": "2 Kings 3:1", "c": 3}, {"q": "What did Jehoram put away?", "o": ["The sacred pillar of Baal", "His father's sword", "The golden calves", "The ark"], "a": 0, "r": "2 Kings 3:2", "c": 3}, {"q": "Mesha was the king of which land?", "o": ["Edom", "Moab", "Syria", "Judah"], "a": 1, "r": "2 Kings 3:4", "c": 3}, {"q": "What was Mesha's work?", "o": ["Fisherman", "Farmer", "Sheepbreeder", "Carpenter"], "a": 2, "r": "2 Kings 3:4", "c": 3}, {"q": "How many lambs did Mesha regularly pay to the king of Israel?", "o": ["One thousand", "Ten thousand", "Fifty thousand", "One hundred thousand"], "a": 3, "r": "2 Kings 3:4", "c": 3}, {"q": "Which king of Judah went with Jehoram to fight Moab?", "o": ["Jehoshaphat", "David", "Ahaziah", "Mesha"], "a": 0, "r": "2 Kings 3:7", "c": 3}, {"q": "Which way did the kings go to fight Moab?", "o": ["By the Jordan River", "By way of the Wilderness of Edom", "By the sea", "Through Samaria"], "a": 1, "r": "2 Kings 3:8", "c": 3}, {"q": "How many kings marched together against Moab?", "o": ["Two", "Three", "Four", "Seven"], "a": 1, "r": "2 Kings 3:9", "c": 3}, {"q": "For how many days did they march with no water?", "o": ["Three", "Five", "Seven", "Ten"], "a": 2, "r": "2 Kings 3:9", "c": 3}, {"q": "Elisha was the son of ____.", "o": ["Shaphat", "Nebat", "Ahab", "Mesha"], "a": 0, "r": "2 Kings 3:11", "c": 3}, {"q": "Elisha was known as the one who poured water on the hands of ____.", "o": ["Jehoshaphat", "Elijah", "Gehazi", "Ahab"], "a": 1, "r": "2 Kings 3:11", "c": 3}, {"q": "What did Elisha ask for before he gave the word of the LORD?", "o": ["A musician", "A bowl", "A lamb", "Some bread"], "a": 0, "r": "2 Kings 3:15", "c": 3}, {"q": "The LORD said to make the valley full of ____.", "o": ["Tents", "Stones", "Ditches", "Trees"], "a": 2, "r": "2 Kings 3:16", "c": 3}, {"q": "When did the water come?", "o": ["At midnight", "In the morning, when the grain offering was offered", "At noon", "In the evening"], "a": 1, "r": "2 Kings 3:20", "c": 3}, {"q": "From which direction did the water come?", "o": ["By way of Edom", "From the sea", "From the sky as rain", "From Jericho"], "a": 0, "r": "2 Kings 3:20", "c": 3}, {"q": "What did the water look like to the Moabites?", "o": ["Clear as glass", "Green like grass", "Red as blood", "Black as night"], "a": 2, "r": "2 Kings 3:22", "c": 3}, {"q": "How many swordsmen did the king of Moab take to try to break through?", "o": ["Seventy", "Three hundred", "Seven hundred", "One thousand"], "a": 2, "r": "2 Kings 3:26", "c": 3}, {"q": "Whose stones were left intact?", "o": ["Kir Haraseth", "Jericho", "Bethel", "Samaria"], "a": 0, "r": "2 Kings 3:25", "c": 3}, {"q": "What was the only thing the widow had in her house?", "o": ["A bag of flour", "A jar of oil", "A loaf of bread", "A lamp"], "a": 1, "r": "2 Kings 4:2", "c": 4}, {"q": "What was the creditor coming to take from the widow?", "o": ["Her house", "Her two sons as slaves", "Her oil", "Her donkey"], "a": 1, "r": "2 Kings 4:1", "c": 4}, {"q": "What did Elisha tell the widow to borrow from her neighbours?", "o": ["Money", "Bread", "Empty vessels", "Clothes"], "a": 2, "r": "2 Kings 4:3", "c": 4}, {"q": "When did the oil stop flowing?", "o": ["At sunset", "When there were no more vessels", "After seven days", "When Elisha came"], "a": 1, "r": "2 Kings 4:6", "c": 4}, {"q": "In which town did the notable woman live?", "o": ["Shunem", "Gilgal", "Jericho", "Ekron"], "a": 0, "r": "2 Kings 4:8", "c": 4}, {"q": "Which of these was NOT put in the upper room for Elisha?", "o": ["A bed", "A table", "A lampstand", "A cupboard"], "a": 3, "r": "2 Kings 4:10", "c": 4}, {"q": "What was the name of Elisha's servant?", "o": ["Gehazi", "Mesha", "Shaphat", "Nebat"], "a": 0, "r": "2 Kings 4:12", "c": 4}, {"q": "What did the boy cry to his father?", "o": ["I am hungry!", "My head, my head!", "My leg, my leg!", "Help me!"], "a": 1, "r": "2 Kings 4:19", "c": 4}, {"q": "Until what time did the boy sit on his mother's knees?", "o": ["Morning", "Noon", "Evening", "Midnight"], "a": 1, "r": "2 Kings 4:20", "c": 4}, {"q": "Where was Elisha when the Shunammite woman went to find him?", "o": ["Mount Carmel", "Samaria", "Jericho", "Bethel"], "a": 0, "r": "2 Kings 4:25", "c": 4}, {"q": "What did Gehazi lay on the face of the child?", "o": ["A cloth", "Elisha's mantle", "Elisha's staff", "Oil"], "a": 2, "r": "2 Kings 4:29-31", "c": 4}, {"q": "How many times did the child sneeze?", "o": ["Three", "Five", "Seven", "Ten"], "a": 2, "r": "2 Kings 4:35", "c": 4}, {"q": "What did Elisha put into the pot to make the stew safe?", "o": ["Salt", "Flour", "Oil", "Water"], "a": 1, "r": "2 Kings 4:41", "c": 4}, {"q": "How many loaves of barley bread did the man bring?", "o": ["Five", "Twelve", "Twenty", "Fifty"], "a": 2, "r": "2 Kings 4:42", "c": 4}, {"q": "How many men were fed with the bread?", "o": ["Fifty", "One hundred", "Five hundred", "Five thousand"], "a": 1, "r": "2 Kings 4:43", "c": 4}, {"q": "Where did the man with the bread come from?", "o": ["Baal Shalisha", "Ekron", "Moab", "Edom"], "a": 0, "r": "2 Kings 4:42", "c": 4}], "who": [{"q": "I was king of Israel. I fell through the lattice of my upper room in Samaria.", "a": "Ahaziah", "r": "2 Kings 1:2", "c": 1}, {"q": "I sent messengers to ask a false god if I would get better. I died just as the LORD said.", "a": "Ahaziah", "r": "2 Kings 1:2, 17", "c": 1}, {"q": "I am a prophet called 'the Tishbite'. I was a hairy man with a leather belt around my waist.", "a": "Elijah", "r": "2 Kings 1:8", "c": 1}, {"q": "I told Elijah to meet the king's messengers. Later I told him, 'Do not be afraid of him.'", "a": "The angel of the LORD", "r": "2 Kings 1:3, 15", "c": 1}, {"q": "We were sent to Ekron, but a man met us on the way and we went back to the king.", "a": "Ahaziah's messengers", "r": "2 Kings 1:5-6", "c": 1}, {"q": "I was the first captain of fifty sent to Elijah. Fire from heaven burned me and my men.", "a": "The first captain of fifty", "r": "2 Kings 1:9-10", "c": 1}, {"q": "I was a captain of fifty. I fell on my knees before Elijah and begged for my life.", "a": "The third captain of fifty", "r": "2 Kings 1:13", "c": 1}, {"q": "I became king of Israel after Ahaziah, because he had no son.", "a": "Jehoram", "r": "2 Kings 1:17", "c": 1}, {"q": "I am the god of Ekron. King Ahaziah wanted to ask me about his injury.", "a": "Baal-Zebub", "r": "2 Kings 1:2", "c": 1}, {"q": "I followed my master from Gilgal to Bethel, to Jericho and to the Jordan. I would not leave him.", "a": "Elisha", "r": "2 Kings 2:1-6", "c": 2}, {"q": "I was taken up into heaven by a whirlwind.", "a": "Elijah", "r": "2 Kings 2:11", "c": 2}, {"q": "I asked for a double portion of my master's spirit.", "a": "Elisha", "r": "2 Kings 2:9", "c": 2}, {"q": "We lived at Bethel and Jericho. We told Elisha that the LORD would take away his master today.", "a": "The sons of the prophets", "r": "2 Kings 2:3, 5", "c": 2}, {"q": "We were fifty strong men. We searched for Elijah for three days but did not find him.", "a": "The fifty men (sons of the prophets)", "r": "2 Kings 2:16-17", "c": 2}, {"q": "What am I? I belonged to Elijah. I was used to strike the Jordan twice, and the water divided.", "a": "Elijah's mantle", "r": "2 Kings 2:8, 14", "c": 2}, {"q": "What am I? I am a river. I divided twice so that the prophets could cross on dry ground.", "a": "The Jordan River", "r": "2 Kings 2:8, 14", "c": 2}, {"q": "What am I? I appeared suddenly with horses of fire and separated Elijah and Elisha.", "a": "A chariot of fire", "r": "2 Kings 2:11", "c": 2}, {"q": "What city am I? My water was bad and my ground was barren, but Elisha healed my water.", "a": "Jericho", "r": "2 Kings 2:18-21", "c": 2}, {"q": "What am I? I was put in a new bowl and thrown into the source of the water.", "a": "Salt", "r": "2 Kings 2:20-21", "c": 2}, {"q": "We came from the city of Bethel and mocked Elisha, calling him 'baldhead'.", "a": "The youths", "r": "2 Kings 2:23", "c": 2}, {"q": "We were two. We came out of the woods and mauled forty-two youths.", "a": "The two female bears", "r": "2 Kings 2:24", "c": 2}, {"q": "I am a mountain. Elisha went to me after Bethel, and the Shunammite woman found him here.", "a": "Mount Carmel", "r": "2 Kings 2:25; 4:25", "c": 2}, {"q": "I am the place where Elijah and Elisha started their journey. Later Elisha cooked stew here during a famine.", "a": "Gilgal", "r": "2 Kings 2:1; 4:38", "c": 2}, {"q": "I am the city where King Ahaziah lived. Elisha returned to me after Mount Carmel.", "a": "Samaria", "r": "2 Kings 1:2; 2:25", "c": 1}, {"q": "I am the son of Ahab. I reigned twelve years and put away the sacred pillar of Baal.", "a": "Jehoram (king of Israel)", "r": "2 Kings 3:1-2", "c": 3}, {"q": "I made Israel sin long ago, and Jehoram still did not depart from my sins.", "a": "Jeroboam the son of Nebat", "r": "2 Kings 3:3", "c": 3}, {"q": "I was king of Moab and a sheepbreeder. I paid one hundred thousand lambs to Israel.", "a": "Mesha", "r": "2 Kings 3:4", "c": 3}, {"q": "I was king of Judah. I said, 'My people as your people, my horses as your horses.'", "a": "Jehoshaphat", "r": "2 Kings 3:7", "c": 3}, {"q": "I was the third king who marched with Israel and Judah to fight Moab.", "a": "The king of Edom", "r": "2 Kings 3:9", "c": 3}, {"q": "I am Elisha's father.", "a": "Shaphat", "r": "2 Kings 3:11", "c": 3}, {"q": "I told the kings that Elisha was there, the one who poured water on the hands of Elijah.", "a": "A servant of the king of Israel", "r": "2 Kings 3:11", "c": 3}, {"q": "When I played, the hand of the LORD came upon Elisha.", "a": "The musician", "r": "2 Kings 3:15", "c": 3}, {"q": "What am I? I was full of ditches and was filled with water without wind or rain.", "a": "The valley", "r": "2 Kings 3:16-17", "c": 3}, {"q": "We saw water as red as blood and thought the kings had killed one another.", "a": "The Moabites", "r": "2 Kings 3:22-23", "c": 3}, {"q": "What city am I? My stones were left intact, but the slingers surrounded and attacked me.", "a": "Kir Haraseth", "r": "2 Kings 3:25", "c": 3}, {"q": "I was king of Moab. I took seven hundred swordsmen to break through to the king of Edom, but failed.", "a": "The king of Moab (Mesha)", "r": "2 Kings 3:26", "c": 3}, {"q": "My husband, who feared the LORD, died. A creditor was coming to take my two sons.", "a": "The widow (wife of one of the sons of the prophets)", "r": "2 Kings 4:1", "c": 4}, {"q": "I was coming to take the widow's two sons to be my slaves.", "a": "The creditor", "r": "2 Kings 4:1", "c": 4}, {"q": "What am I? I was the only thing in the widow's house, and I kept pouring until the vessels were full.", "a": "The jar of oil", "r": "2 Kings 4:2-6", "c": 4}, {"q": "I told my mother, 'There is not another vessel.'", "a": "The widow's son", "r": "2 Kings 4:6", "c": 4}, {"q": "I am a notable woman of Shunem. I persuaded Elisha to eat food at my house.", "a": "The Shunammite woman", "r": "2 Kings 4:8", "c": 4}, {"q": "What am I? I was built on the wall with a bed, a table, a chair and a lampstand for the man of God.", "a": "The small upper room", "r": "2 Kings 4:10", "c": 4}, {"q": "I am Elisha's servant. I told him that the Shunammite woman had no son.", "a": "Gehazi", "r": "2 Kings 4:12-14", "c": 4}, {"q": "Elisha told me, 'About this time next year you shall embrace a son.'", "a": "The Shunammite woman", "r": "2 Kings 4:16", "c": 4}, {"q": "I went out to the reapers and cried to my father, 'My head, my head!'", "a": "The Shunammite's son", "r": "2 Kings 4:18-19", "c": 4}, {"q": "I am an old man. I told a servant to carry my sick son to his mother.", "a": "The Shunammite's husband", "r": "2 Kings 4:14, 19", "c": 4}, {"q": "What am I? I was saddled so the Shunammite woman could ride quickly to Mount Carmel.", "a": "A donkey", "r": "2 Kings 4:24", "c": 4}, {"q": "I tried to push the Shunammite woman away when she caught Elisha by the feet.", "a": "Gehazi", "r": "2 Kings 4:27", "c": 4}, {"q": "I caught Elisha by the feet at the hill because my soul was in deep distress.", "a": "The Shunammite woman", "r": "2 Kings 4:27", "c": 4}, {"q": "What am I? I was laid on the face of the dead child, but there was no voice or hearing.", "a": "Elisha's staff", "r": "2 Kings 4:29-31", "c": 4}, {"q": "I sneezed seven times and opened my eyes.", "a": "The Shunammite's son", "r": "2 Kings 4:35", "c": 4}, {"q": "I went into the field to gather herbs and sliced wild gourds into the pot of stew.", "a": "One of the sons of the prophets", "r": "2 Kings 4:39", "c": 4}, {"q": "What am I? I was put into the pot of stew, and then there was nothing harmful in it.", "a": "Flour", "r": "2 Kings 4:41", "c": 4}, {"q": "I came from Baal Shalisha with twenty loaves of barley bread for the man of God.", "a": "The man from Baal Shalisha", "r": "2 Kings 4:42", "c": 4}, {"q": "I asked, 'What? Shall I set this before one hundred men?'", "a": "Elisha's servant", "r": "2 Kings 4:43", "c": 4}, {"q": "I made the valley full of water and gave the Moabites into the kings' hands. It was a simple matter for Me.", "a": "The LORD", "r": "2 Kings 3:17-18", "c": 3}], "said": [{"q": "\"Go, inquire of Baal-Zebub, the god of Ekron, whether I shall recover from this injury.\"", "a": "King Ahaziah to his messengers", "r": "2 Kings 1:2", "c": 1}, {"q": "\"Arise, go up to meet the messengers of the king of Samaria.\"", "a": "The angel of the LORD to Elijah", "r": "2 Kings 1:3", "c": 1}, {"q": "\"Is it because there is no God in Israel that you are going to inquire of Baal-Zebub?\"", "a": "Elijah to Ahaziah's messengers", "r": "2 Kings 1:3, 6", "c": 1}, {"q": "\"Why have you come back?\"", "a": "Ahaziah to his messengers", "r": "2 Kings 1:5", "c": 1}, {"q": "\"What kind of man was it who came up to meet you and told you these words?\"", "a": "Ahaziah to his messengers", "r": "2 Kings 1:7", "c": 1}, {"q": "\"A hairy man wearing a leather belt around his waist.\"", "a": "The messengers to Ahaziah", "r": "2 Kings 1:8", "c": 1}, {"q": "\"It is Elijah the Tishbite.\"", "a": "Ahaziah to his messengers", "r": "2 Kings 1:8", "c": 1}, {"q": "\"Man of God, the king has said, 'Come down!'\"", "a": "The first captain of fifty to Elijah", "r": "2 Kings 1:9", "c": 1}, {"q": "\"If I am a man of God, then let fire come down from heaven and consume you and your fifty men.\"", "a": "Elijah to the captain of fifty", "r": "2 Kings 1:10", "c": 1}, {"q": "\"Man of God, thus has the king said, 'Come down quickly!'\"", "a": "The second captain of fifty to Elijah", "r": "2 Kings 1:11", "c": 1}, {"q": "\"Man of God, please let my life and the life of these fifty servants of yours be precious in your sight.\"", "a": "The third captain of fifty to Elijah", "r": "2 Kings 1:13", "c": 1}, {"q": "\"Go down with him; do not be afraid of him.\"", "a": "The angel of the LORD to Elijah", "r": "2 Kings 1:15", "c": 1}, {"q": "\"You shall not come down from the bed to which you have gone up, but you shall surely die.\"", "a": "Elijah to King Ahaziah", "r": "2 Kings 1:16", "c": 1}, {"q": "\"Stay here, please, for the LORD has sent me on to Bethel.\"", "a": "Elijah to Elisha", "r": "2 Kings 2:2", "c": 2}, {"q": "\"As the LORD lives, and as your soul lives, I will not leave you!\" (on the way to Bethel)", "a": "Elisha to Elijah", "r": "2 Kings 2:2", "c": 2}, {"q": "\"Do you know that the LORD will take away your master from over you today?\"", "a": "The sons of the prophets to Elisha", "r": "2 Kings 2:3", "c": 2}, {"q": "\"Yes, I know; keep silent!\"", "a": "Elisha to the sons of the prophets", "r": "2 Kings 2:3", "c": 2}, {"q": "\"Ask! What may I do for you, before I am taken away from you?\"", "a": "Elijah to Elisha", "r": "2 Kings 2:9", "c": 2}, {"q": "\"Please let a double portion of your spirit be upon me.\"", "a": "Elisha to Elijah", "r": "2 Kings 2:9", "c": 2}, {"q": "\"You have asked a hard thing.\"", "a": "Elijah to Elisha", "r": "2 Kings 2:10", "c": 2}, {"q": "\"My father, my father, the chariot of Israel and its horsemen!\"", "a": "Elisha, crying out as Elijah went up", "r": "2 Kings 2:12", "c": 2}, {"q": "\"Where is the LORD God of Elijah?\"", "a": "Elisha, as he struck the Jordan with the mantle", "r": "2 Kings 2:14", "c": 2}, {"q": "\"The spirit of Elijah rests on Elisha.\"", "a": "The sons of the prophets from Jericho", "r": "2 Kings 2:15", "c": 2}, {"q": "\"Please let them go and search for your master.\"", "a": "The sons of the prophets to Elisha", "r": "2 Kings 2:16", "c": 2}, {"q": "\"You shall not send anyone.\"", "a": "Elisha to the sons of the prophets", "r": "2 Kings 2:16", "c": 2}, {"q": "\"Did I not say to you, 'Do not go'?\"", "a": "Elisha to the men who searched for Elijah", "r": "2 Kings 2:18", "c": 2}, {"q": "\"The situation of this city is pleasant ... but the water is bad, and the ground barren.\"", "a": "The men of the city (Jericho) to Elisha", "r": "2 Kings 2:19", "c": 2}, {"q": "\"Bring me a new bowl, and put salt in it.\"", "a": "Elisha to the men of the city", "r": "2 Kings 2:20", "c": 2}, {"q": "\"Go up, you baldhead!\"", "a": "The youths to Elisha", "r": "2 Kings 2:23", "c": 2}, {"q": "\"The king of Moab has rebelled against me. Will you go with me to fight against Moab?\"", "a": "Jehoram king of Israel to Jehoshaphat king of Judah", "r": "2 Kings 3:7", "c": 3}, {"q": "\"I will go up; I am as you are, my people as your people, my horses as your horses.\"", "a": "Jehoshaphat to Jehoram", "r": "2 Kings 3:7", "c": 3}, {"q": "\"Alas! For the LORD has called these three kings together to deliver them into the hand of Moab.\"", "a": "The king of Israel (Jehoram)", "r": "2 Kings 3:10", "c": 3}, {"q": "\"Is there no prophet of the LORD here, that we may inquire of the LORD by him?\"", "a": "Jehoshaphat", "r": "2 Kings 3:11", "c": 3}, {"q": "\"Elisha the son of Shaphat is here, who poured water on the hands of Elijah.\"", "a": "A servant of the king of Israel to Jehoshaphat", "r": "2 Kings 3:11", "c": 3}, {"q": "\"The word of the LORD is with him.\"", "a": "Jehoshaphat, about Elisha", "r": "2 Kings 3:12", "c": 3}, {"q": "\"What have I to do with you? Go to the prophets of your father and the prophets of your mother.\"", "a": "Elisha to the king of Israel", "r": "2 Kings 3:13", "c": 3}, {"q": "\"But now bring me a musician.\"", "a": "Elisha to the kings", "r": "2 Kings 3:15", "c": 3}, {"q": "\"Make this valley full of ditches.\"", "a": "Elisha to the kings (the word of the LORD)", "r": "2 Kings 3:16", "c": 3}, {"q": "\"You shall not see wind, nor shall you see rain; yet that valley shall be filled with water.\"", "a": "Elisha to the kings (the word of the LORD)", "r": "2 Kings 3:17", "c": 3}, {"q": "\"This is blood; the kings have surely struck swords and have killed one another; now therefore, Moab, to the spoil!\"", "a": "The Moabites to one another", "r": "2 Kings 3:23", "c": 3}, {"q": "\"Your servant my husband is dead, and you know that your servant feared the LORD.\"", "a": "The widow to Elisha", "r": "2 Kings 4:1", "c": 4}, {"q": "\"Tell me, what do you have in the house?\"", "a": "Elisha to the widow", "r": "2 Kings 4:2", "c": 4}, {"q": "\"Your maidservant has nothing in the house but a jar of oil.\"", "a": "The widow to Elisha", "r": "2 Kings 4:2", "c": 4}, {"q": "\"Go, borrow vessels from everywhere, from all your neighbors - empty vessels; do not gather just a few.\"", "a": "Elisha to the widow", "r": "2 Kings 4:3", "c": 4}, {"q": "\"Bring me another vessel.\"", "a": "The widow to her son", "r": "2 Kings 4:6", "c": 4}, {"q": "\"There is not another vessel.\"", "a": "The widow's son to his mother", "r": "2 Kings 4:6", "c": 4}, {"q": "\"Go, sell the oil and pay your debt; and you and your sons live on the rest.\"", "a": "Elisha to the widow", "r": "2 Kings 4:7", "c": 4}, {"q": "\"Look now, I know that this is a holy man of God, who passes by us regularly.\"", "a": "The Shunammite woman to her husband", "r": "2 Kings 4:9", "c": 4}, {"q": "\"Please, let us make a small upper room on the wall.\"", "a": "The Shunammite woman to her husband", "r": "2 Kings 4:10", "c": 4}, {"q": "\"Call this Shunammite woman.\"", "a": "Elisha to Gehazi", "r": "2 Kings 4:12", "c": 4}, {"q": "\"Do you want me to speak on your behalf to the king or to the commander of the army?\"", "a": "Elisha (through Gehazi) to the Shunammite woman", "r": "2 Kings 4:13", "c": 4}, {"q": "\"I dwell among my own people.\"", "a": "The Shunammite woman to Elisha", "r": "2 Kings 4:13", "c": 4}, {"q": "\"Actually, she has no son, and her husband is old.\"", "a": "Gehazi to Elisha", "r": "2 Kings 4:14", "c": 4}, {"q": "\"About this time next year you shall embrace a son.\"", "a": "Elisha to the Shunammite woman", "r": "2 Kings 4:16", "c": 4}, {"q": "\"No, my lord. Man of God, do not lie to your maidservant!\"", "a": "The Shunammite woman to Elisha", "r": "2 Kings 4:16", "c": 4}, {"q": "\"My head, my head!\"", "a": "The Shunammite's son to his father", "r": "2 Kings 4:19", "c": 4}, {"q": "\"Carry him to his mother.\"", "a": "The boy's father to a servant", "r": "2 Kings 4:19", "c": 4}, {"q": "\"Please send me one of the young men and one of the donkeys, that I may run to the man of God.\"", "a": "The Shunammite woman to her husband", "r": "2 Kings 4:22", "c": 4}, {"q": "\"Why are you going to him today? It is neither the New Moon nor the Sabbath.\"", "a": "The husband to the Shunammite woman", "r": "2 Kings 4:23", "c": 4}, {"q": "\"Drive, and go forward; do not slacken the pace for me unless I tell you.\"", "a": "The Shunammite woman to her servant", "r": "2 Kings 4:24", "c": 4}, {"q": "\"Look, the Shunammite woman!\"", "a": "Elisha to Gehazi", "r": "2 Kings 4:25", "c": 4}, {"q": "\"Is it well with you? Is it well with your husband? Is it well with the child?\"", "a": "Gehazi (sent by Elisha) to the Shunammite woman", "r": "2 Kings 4:26", "c": 4}, {"q": "\"Let her alone; for her soul is in deep distress.\"", "a": "Elisha to Gehazi", "r": "2 Kings 4:27", "c": 4}, {"q": "\"Did I ask a son of my lord? Did I not say, 'Do not deceive me'?\"", "a": "The Shunammite woman to Elisha", "r": "2 Kings 4:28", "c": 4}, {"q": "\"Take my staff in your hand ... lay my staff on the face of the child.\"", "a": "Elisha to Gehazi", "r": "2 Kings 4:29", "c": 4}, {"q": "\"As the LORD lives, and as your soul lives, I will not leave you.\" (in chapter 4)", "a": "The Shunammite woman to Elisha", "r": "2 Kings 4:30", "c": 4}, {"q": "\"The child has not awakened.\"", "a": "Gehazi to Elisha", "r": "2 Kings 4:31", "c": 4}, {"q": "\"Pick up your son.\"", "a": "Elisha to the Shunammite woman", "r": "2 Kings 4:36", "c": 4}, {"q": "\"Put on the large pot, and boil stew for the sons of the prophets.\"", "a": "Elisha to his servant", "r": "2 Kings 4:38", "c": 4}, {"q": "\"Man of God, there is death in the pot!\"", "a": "The sons of the prophets to Elisha", "r": "2 Kings 4:40", "c": 4}, {"q": "\"Then bring some flour.\"", "a": "Elisha to the sons of the prophets", "r": "2 Kings 4:41", "c": 4}, {"q": "\"Give it to the people, that they may eat.\"", "a": "Elisha to his servant", "r": "2 Kings 4:42-43", "c": 4}, {"q": "\"What? Shall I set this before one hundred men?\"", "a": "Elisha's servant to Elisha", "r": "2 Kings 4:43", "c": 4}], "fill": [{"q": "Moab rebelled against Israel after the death of ______.", "a": "Ahab", "r": "2 Kings 1:1", "c": 1}, {"q": "Now Ahaziah fell through the ______ of his upper room in Samaria.", "a": "lattice", "r": "2 Kings 1:2", "c": 1}, {"q": "Go, inquire of Baal-Zebub, the god of ______.", "a": "Ekron", "r": "2 Kings 1:2", "c": 1}, {"q": "Is it because there is no ______ in Israel that you are going to inquire of Baal-Zebub?", "a": "God", "r": "2 Kings 1:3", "c": 1}, {"q": "You shall not come down from the ______ to which you have gone up.", "a": "bed", "r": "2 Kings 1:4", "c": 1}, {"q": "A ______ man wearing a leather belt around his waist.", "a": "hairy", "r": "2 Kings 1:8", "c": 1}, {"q": "A hairy man wearing a ______ belt around his waist.", "a": "leather", "r": "2 Kings 1:8", "c": 1}, {"q": "There he was, sitting on the top of a ______.", "a": "hill", "r": "2 Kings 1:9", "c": 1}, {"q": "If I am a man of God, then let ______ come down from heaven.", "a": "fire", "r": "2 Kings 1:10", "c": 1}, {"q": "Man of God, thus has the king said, 'Come down ______!'", "a": "quickly", "r": "2 Kings 1:11", "c": 1}, {"q": "Please let my life ... be ______ in your sight.", "a": "precious", "r": "2 Kings 1:13", "c": 1}, {"q": "Go down with him; do not be ______ of him.", "a": "afraid", "r": "2 Kings 1:15", "c": 1}, {"q": "Because he had no ______, Jehoram became king in his place.", "a": "son", "r": "2 Kings 1:17", "c": 1}, {"q": "The LORD was about to take up Elijah into heaven by a ______.", "a": "whirlwind", "r": "2 Kings 2:1", "c": 2}, {"q": "Elijah went with Elisha from ______.", "a": "Gilgal", "r": "2 Kings 2:1", "c": 2}, {"q": "As the LORD lives, and as your soul lives, I will not ______ you!", "a": "leave", "r": "2 Kings 2:2", "c": 2}, {"q": "Yes, I
